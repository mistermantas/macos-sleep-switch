name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: |
          chmod +x build.sh package.sh
          ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sleep-Switch
          path: dist/Sleep-Switch.zip

name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated project and distribution configuration
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          git diff --exit-code -- SleepSwitch.xcodeproj
          chmod +x verify-distribution.sh
          ./verify-distribution.sh
      - name: Test
        run: |
          chmod +x test.sh
          ./test.sh
      - name: Build and package
        run: |
          chmod +x build.sh package.sh
          ./package.sh
      - name: Build sandboxed Mac App Store target
        run: |
          chmod +x test-app-store.sh
          ./test-app-store.sh
      - name: Build iOS companion (simulator compile check)
        run: |
          xcodebuild -quiet \
            -project SleepSwitch.xcodeproj \
            -scheme SleepSwitchCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/companion-ci \
            CODE_SIGNING_ALLOWED=NO \
            build
      - uses: actions/upload-artifact@v7
        with:
          name: Sleep-Switch
          path: dist/Sleep-Switch.zip

name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          chmod +x test.sh
          ./test.sh
      - name: Build and package
        run: |
          chmod +x build.sh package.sh
          ./package.sh
      - name: Build sandboxed Mac App Store target
        run: |
          chmod +x test-app-store.sh
          ./test-app-store.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Sleep-Switch
          path: dist/Sleep-Switch.zip

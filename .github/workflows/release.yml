name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          chmod +x test.sh
          ./test.sh
      - name: Build and package
        run: |
          chmod +x build.sh package.sh
          ./package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/Sleep-Switch.zip
          --title "Sleep Switch ${GITHUB_REF_NAME#v}"
          --generate-notes

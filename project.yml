name: SleepSwitch

options:
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    SWIFT_VERSION: "5.0"

targets:
  SleepSwitch:
    type: application
    productName: Sleep Switch
    platform: macOS
    sources:
      - path: Sources/SleepSwitch
      - path: Sources/SleepSwitchFanProtocol
      - path: AppStore/Assets.xcassets
        buildPhase: resources
      - path: AppStore/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AppStore/SleepSwitch.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C43F5MKJF2
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 38
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AppStore/Info.plist
        MARKETING_VERSION: 2.4.2
        OTHER_LDFLAGS: "-lsqlite3"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        PRODUCT_BUNDLE_IDENTIFIER: lt.mantas.sleepswitch
        PRODUCT_NAME: Sleep Switch
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: AppStore/SleepSwitch.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: AppStore/SleepSwitch.entitlements

  SleepSwitchCompanion:
    type: application
    productName: Sleep Switch
    platform: iOS
    sources:
      - path: Sources/SleepSwitchCompanion
      - path: Sources/SleepSwitch/CompanionProtocol.swift
      - path: Sources/SleepSwitch/CompanionOperatorModels.swift
      - path: Sources/SleepSwitch/LocalPreviewSecurity.swift
      - path: Sources/SleepSwitch/InsightsModels.swift
      - path: Sources/SleepSwitch/AppLinks.swift
      - path: Sources/SleepSwitch/CompanionCloudStore.swift
        buildPhase: sources
      - path: Sources/SleepSwitch/CompanionContextTransferHistory.swift
        buildPhase: sources
      - path: Sources/SleepSwitch/RemoteArtifactDownloadStore.swift
        buildPhase: sources
      - path: Sources/SleepSwitch/RemoteWorkAttention.swift
        buildPhase: sources
      - path: Sources/Shared/CompanionWidgetShared.swift
      - path: Sources/Shared/ManualSessionActivityAttributes.swift
      - path: Sources/Shared/SharedContextIntake.swift
      - path: Companion/Assets.xcassets
        buildPhase: resources
      - path: Companion/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 38
        CODE_SIGN_ENTITLEMENTS: Companion/SleepSwitchCompanion.entitlements
        DEVELOPMENT_TEAM: C43F5MKJF2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Companion/Info.plist
        MARKETING_VERSION: 2.4.2
        PRODUCT_BUNDLE_IDENTIFIER: lt.mantas.sleepswitch.companion
        PRODUCT_NAME: Sleep Switch
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Companion/SleepSwitchCompanion.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Companion/SleepSwitchCompanion.entitlements
    dependencies:
      - target: SleepSwitchCompanionWidgets
      - target: SleepSwitchCompanionShare

  SleepSwitchCompanionShare:
    type: app-extension
    productName: Sleep Switch Share
    platform: iOS
    sources:
      - path: Sources/SleepSwitchCompanionShare
      - path: Sources/Shared/SharedContextIntake.swift
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CompanionShare/SleepSwitchCompanionShare.entitlements
        DEVELOPMENT_TEAM: C43F5MKJF2
        CURRENT_PROJECT_VERSION: 38
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CompanionShare/Info.plist
        MARKETING_VERSION: 2.4.2
        PRODUCT_BUNDLE_IDENTIFIER: lt.mantas.sleepswitch.companion.share
        PRODUCT_NAME: Sleep Switch Share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  SleepSwitchCompanionWidgets:
    type: app-extension
    productName: Sleep Switch Widgets
    platform: iOS
    sources:
      - path: Sources/SleepSwitchCompanionWidgets
      - path: Sources/Shared/CompanionWidgetShared.swift
      - path: Sources/Shared/ManualSessionActivityAttributes.swift
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CompanionWidgets/SleepSwitchCompanionWidgets.entitlements
        DEVELOPMENT_TEAM: C43F5MKJF2
        CURRENT_PROJECT_VERSION: 38
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CompanionWidgets/Info.plist
        MARKETING_VERSION: 2.4.2
        PRODUCT_BUNDLE_IDENTIFIER: lt.mantas.sleepswitch.companion.widgets
        PRODUCT_NAME: Sleep Switch Widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  SleepSwitch:
    build:
      targets:
        SleepSwitch: all
    run:
      config: Debug
    archive:
      config: Release
  SleepSwitchCompanion:
    build:
      targets:
        SleepSwitchCompanion: all
    run:
      config: Debug
    archive:
      config: Release
